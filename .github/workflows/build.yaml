name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit tests
        run: go test ./...
      - name: build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t upscaler-service:test .
      - name: the runner upscales an image inside the image
        run: |
          python3 -c "from PIL import Image; Image.new('RGB',(96,64),(200,30,30)).save('/tmp/in.png')" 2>/dev/null || docker run --rm -v /tmp:/tmp --entrypoint python3 upscaler-service:test -c "from PIL import Image; Image.new('RGB',(96,64),(200,30,30)).save('/tmp/in.png')"
          docker run --rm -v /tmp:/tmp --entrypoint /app/runner/upscale.py upscaler-service:test -i /tmp/in.png -o /tmp/out.png -n realesr-general-x4v3 -s 2 -t 64 -v
          docker run --rm -v /tmp:/tmp --entrypoint python3 upscaler-service:test -c "from PIL import Image; im=Image.open('/tmp/out.png'); assert im.size==(192,128), im.size; print('ok', im.size)"

  release:
    # semantic-release builds the image from the release commit, tags it with the
    # new version and `latest`, pushes both to Harbor, then bumps every
    # `tag: X # upscaler-service` in weeb-argocd.
    runs-on: ubuntu-latest
    needs: [ test ]
    if: github.event_name == 'push'
    steps:
      - name: Set repo name environment variable
        run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: release
        id: semantic
        uses: cycjimmy/semantic-release-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          DOCKER_REPO_TEST: ${{ secrets.REGISTRY }}/weeb-vip/${{ env.REPO_NAME }}
          DOCKER_REPO_PROD: ${{ secrets.REGISTRY }}/weeb-vip/${{ env.REPO_NAME }}
        with:
          semantic_version: 18
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/exec@6.0.2
            @semantic-release/changelog@6.0.1
      - name: checkout argocd repo
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/checkout@v4
        with:
          repository: 'weeb-vip/weeb-argocd'
          token: ${{ secrets.ACCESS_TOKEN }}
          path: 'argocd'
      - name: deploy to argocd
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          REPO_NAME: ${{ env.REPO_NAME }}
          RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          RELEASE_VERSION=$(echo $RELEASE_VERSION | sed 's/v//')
          cd argocd && find . -type f -name '*.yaml' -print0 | xargs -0 sed -E -i 's/(tag:[[:space:]]).*( # '"$REPO_NAME"')/\1'"$RELEASE_VERSION"'\2/'
          git config --global user.email "noreply@weeb.vip"
          git config --global user.name "weeb-vip"
          if git diff --quiet; then
            echo "argocd already references $RELEASE_VERSION (or no chart uses this image yet)"; exit 0
          fi
          git add .
          git commit -m "feat: $REPO_NAME $RELEASE_VERSION"
          git push origin main
